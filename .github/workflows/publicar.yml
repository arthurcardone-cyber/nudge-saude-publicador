name: publicar
on:
  schedule:
    - cron: "*/20 * * * *"   # a cada 20 minutos
  workflow_dispatch:
    inputs:
      renovar:
        description: "Renovar o token agora"
        type: boolean
        default: false
      teste:
        description: "Só testar a conexão (não publica)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar o que está na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
        run: python publicar.py ${{ inputs.renovar && '--renovar' || '' }} ${{ inputs.teste && '--teste' || '' }}
      - name: Guardar o que foi publicado
        if: always()
        run: |
          git config user.name "robo-nudge-saude"
          git config user.email "robo@users.noreply.github.com"
          for f in publicados.json token.enc; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "registro de publicação" && git push)
